[package]
name = "lixi-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "mp3"] }
rubato = "=0.16.2"
opus = "=0.3.0"
soundtouch = { version = "=0.5.4", default-features = false }

[profile.dev]
debug = 0
incremental = false
